<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Your Portrait — Furamous</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #FAF7F2; color: #1A1714; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: white; border-radius: 24px; padding: 48px; max-width: 600px; width: 100%; text-align: center; border: 1px solid rgba(0,0,0,0.08); }
  .loading { font-size: 48px; margin-bottom: 24px; animation: spin 2s linear infinite; display: inline-block; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; margin-bottom: 16px; }
  p { font-size: 15px; color: #6B6459; line-height: 1.7; margin-bottom: 12px; }
  .portrait-img { width: 100%; border-radius: 16px; margin: 24px 0; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  .btn { display: inline-block; background: #C9963A; color: white; padding: 16px 36px; border-radius: 100px; text-decoration: none; font-size: 15px; font-weight: 600; margin-top: 8px; cursor: pointer; border: none; }
  .btn:hover { background: #8B6520; }
  .btn-secondary { display: inline-block; background: transparent; color: #C9963A; padding: 12px 24px; border-radius: 100px; text-decoration: none; font-size: 14px; font-weight: 600; margin-top: 8px; border: 1.5px solid #C9963A; margin-left: 12px; }
  .downloads-left { font-size: 12px; color: #9CA3AF; margin-top: 16px; }
  .error-icon { font-size: 48px; margin-bottom: 16px; }
  .pet-name { color: #C9963A; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading">🎨</div>
  <h1>Loading your portrait...</h1>
  <p>Please wait a moment.</p>
</div>

<script>
  const BACKEND_URL = 'https://furamous-backend.onrender.com';
  const token = window.location.pathname.split('/download/')[1];

  async function loadPortrait() {
    if (!token) {
      showError('Invalid download link.');
      return;
    }

    try {
      const res = await fetch(`${BACKEND_URL}/download/${token}`);
      const data = await res.json();

      if (res.status === 404) {
        showError('This download link is invalid or has expired.');
        return;
      }

      if (res.status === 410) {
        showError('This download link has expired. Please contact orders@furamous.com for help.');
        return;
      }

      if (res.status === 429) {
        showError('Maximum downloads reached. Please contact orders@furamous.com if you need help.');
        return;
      }

      if (data.success) {
        showPortrait(data);
      }
    } catch (err) {
      showError('Something went wrong. Please try again or contact orders@furamous.com');
    }
  }

  function showPortrait(data) {
    const card = document.getElementById('card');
    card.innerHTML = `
      <div style="font-size:48px; margin-bottom:16px;">🎉</div>
      <h1>Your portrait is ready!</h1>
      <p>${data.petName ? `<span class="pet-name">${data.petName}'s</span>` : 'Your pet\'s'} ${data.style} portrait has been created with love.</p>
      <img src="${data.portraitUrl}" class="portrait-img" alt="Pet Portrait" />
      <br>
      <a href="${data.portraitUrl}" download="furamous-portrait.png" class="btn">⬇ Download Portrait</a>
      <a href="https://furamous.com" class="btn-secondary">Order another</a>
      <p class="downloads-left">${data.downloadsRemaining} download${data.downloadsRemaining !== 1 ? 's' : ''} remaining · Link expires in 7 days</p>
      <p style="font-size:12px; color:#9CA3AF; margin-top:24px;">Save your portrait somewhere safe — this link will expire. Questions? orders@furamous.com</p>
    `;
  }

  function showError(message) {
    const card = document.getElementById('card');
    card.innerHTML = `
      <div class="error-icon">😢</div>
      <h1>Oops!</h1>
      <p>${message}</p>
      <a href="https://furamous.com" class="btn" style="margin-top:24px;">Back to Furamous</a>
    `;
  }

  loadPortrait();
</script>
</body>
</html>
